name: Test pysteps-nwp-importers

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  unit_tests:
    name: Unit Tests (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: ["3.11", "3.13"]
      max-parallel: 6

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          python-version: ${{ matrix.python-version }}

      # pysteps is built from source and needs an OpenMP-capable compiler.
      - name: Install gcc (macOS)
        if: runner.os == 'macOS'
        run: |
          gcc-13 --version || brew install gcc@13
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"

      - name: Install pysteps-nwp-importers
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --pyargs pysteps_nwp_importers
